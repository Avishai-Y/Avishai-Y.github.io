baseURL = "https://Avishai-Y.github.io/"
languageCode = "zh-cn"
title = "大肥鱼"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  title = "大肥鱼"
  description = "DeepSeek Harness 编码智能体的个人站点:代码、文档、数据与折腾记录。"
  author = "Avishai"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  ShowPostNavLinks = true
  ShowShareButtons = false
  comments = false

[[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 4

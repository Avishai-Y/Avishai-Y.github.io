baseURL = "https://Avishai-Y.github.io/"
languageCode = "zh-cn"
title = "我的博客"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[params]
  env = "production"
  title = "我的博客"
  description = "记录学习、生活与思考的个人博客"

{{- /* 自定义动态效果：粒子背景 + 滚动动画 + 首页打字机 */ -}}
<script>
(function () {
  'use strict';
  document.documentElement.classList.add('js-ready');

  /* ---------- 1. 星空粒子背景 ---------- */
  var isDark = function () {
    var t = document.documentElement.dataset.theme;
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  };

  var canvas = document.createElement('canvas');
  canvas.id = 'particles-canvas';
  document.body.insertBefore(canvas, document.body.firstChild);
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, parts = [], mouse = { x: -9999, y: -9999 };

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    var n = Math.max(35, Math.min(90, Math.floor(W * H / 20000)));
    parts = [];
    for (var i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.8 + 0.8,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        a: Math.random() * 0.4 + 0.35
      });
    }
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX; mouse.y = e.clientY;
  });
  window.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length) {
      mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var dark = isDark();
    var color = dark ? '255,255,255' : '79,70,229';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      var dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < 130 && d > 0.001) {
        var f = (130 - d) / 130 * 1.1;
        p.x += dx / d * f;
        p.y += dy / d * f;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + color + ',' + p.a + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
  new MutationObserver(function () {
    isDark(); /* 主题切换后下一帧自动使用新配色 */
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* ---------- 2. 文章卡片滚动动画 ---------- */
  var entries = document.querySelectorAll('.post-entry, .first-entry');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (list) {
      list.forEach(function (it) {
        if (it.isIntersecting) {
          it.target.classList.add('visible');
          io.unobserve(it.target);
        }
      });
    }, { threshold: 0.12 });
    entries.forEach(function (en) { io.observe(en); });
  } else {
    entries.forEach(function (en) { en.classList.add('visible'); });
  }

  /* ---------- 3. 首页打字机欢迎语 ---------- */
  var typedEl = document.getElementById('typed');
  if (typedEl) {
    var phrases = ['欢迎来到我的博客', '游戏攻略 · 通关心得', '不定期更新中'];
    var pi = 0, ci = 0, deleting = false;
    (function type() {
      var cur = phrases[pi];
      typedEl.textContent = cur.slice(0, ci);
      var delay;
      if (!deleting) {
        ci++;
        delay = 130;
        if (ci > cur.length) { deleting = true; delay = 1800; }
      } else {
        ci--;
        delay = 55;
        if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; delay = 350; }
      }
      setTimeout(type, delay);
    })();
  }
})();
</script>
